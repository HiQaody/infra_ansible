---
- name: Installer les dépendances pour Docker
  dnf:
    name:
      - dnf-plugins-core
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Ajouter la clé GPG officielle de Docker
  get_url:
    url: https://download.docker.com/linux/centos/gpg
    dest: /etc/pki/rpm-gpg/docker-ce-key.gpg
    mode: '0644'
    force: yes

- name: Ajouter le dépôt Docker CE
  yum_repository:
    name: docker-ce
    description: Docker CE Stable
    baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
    gpgcheck: yes
    gpgkey: https://download.docker.com/linux/centos/gpg
    state: present
    enabled: yes

- name: Installer Docker
  dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Démarrer et activer le service Docker
  service:
    name: docker
    state: started
    enabled: yes

- name: Ajouter l'utilisateur principal au groupe docker
  user:
    name: "{{ docker_user }}"
    groups: docker
    append: yes

- name: Ajouter les autres utilisateurs au groupe docker
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_users }}"
  when: docker_users is defined and docker_users | length > 0

- name: Afficher un message pour la reconnexion au groupe docker
  debug:
    msg: "Les utilisateurs {{ ([docker_user] + (docker_users | default([]))) | join(', ') }} doivent se déconnecter/reconnecter pour utiliser Docker sans sudo."
