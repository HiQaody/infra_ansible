---
- name: Arrêter le service PHP 8.3 FPM
  systemd:
    name: php-fpm
    state: stopped
  ignore_errors: yes

- name: Supprimer les paquets PHP
  dnf:
    name: php*
    state: absent
  ignore_errors: yes

- name: Installer EPEL et le dépôt Remi pour PHP
  dnf:
    name:
      - epel-release
      - yum-utils
    state: present
    update_cache: yes

- name: Ajouter le dépôt Remi pour PHP
  yum_repository:
    name: remi
    description: Remi's RPM repository for Enterprise Linux 10 - $basearch
    baseurl: "https://rpms.remirepo.net/enterprise/10/remi/$basearch/"
    gpgcheck: yes
    gpgkey: "https://rpms.remirepo.net/RPM-GPG-KEY-remi"
    state: present
    enabled: yes

- name: Activer le module PHP depuis Remi
  command: dnf module enable php:remi-8.3 -y
  ignore_errors: yes

- name: Mettre à jour le cache DNF
  dnf:
    update_cache: yes

- name: Installer PHP et extensions courantes
  dnf:
    name:
      - php
      - php-fpm
      - php-common
      - php-cli
      - php-mysqlnd
      - php-curl
      - php-gd
      - php-mbstring
      - php-xml
      - php-zip
      - php-json
      - php-bcmath
      - php-pgsql
      - php-pdo
      - php-pdo-pgsql
    state: present

- name: Démarrer et activer le service PHP FPM
  systemd:
    name: php-fpm
    state: started
    enabled: yes

- name: Vérifier la version de PHP
  command: php -v
  register: php_version
  changed_when: false

- name: Afficher la version de PHP installée
  debug:
    var: php_version.stdout

- name: Vérifier le statut du service PHP FPM
  systemd:
    name: php-fpm
  register: php_fpm_status
  changed_when: false

- name: Afficher le statut du service PHP FPM
  debug:
    var: php_fpm_status
