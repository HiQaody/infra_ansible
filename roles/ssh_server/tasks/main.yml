---
- name: Installer le serveur OpenSSH
  dnf:
    name: openssh-server
    state: present
    update_cache: yes

- name: S'assurer que le service SSH est lancé et activé
  service:
    name: sshd
    state: started
    enabled: yes

- name: Configurer le port SSH personnalisé
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Port\s+'
    line: "Port {{ ssh_port }}"
    state: present
    backup: yes

- name: Désactiver l'accès root en SSH
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present
    backup: yes


- name: Désactiver la port SSH par défaut (22) dans Firewalld
  firewalld:
    port: 22/tcp
    permanent: yes
    state: disabled
    immediate: yes

- name: Autoriser le nouveau port SSH dans Firewalld
  firewalld:
    port: "{{ ssh_port }}/tcp"
    permanent: yes
    state: enabled
    immediate: yes

- name: Redémarrer le service SSH si la configuration a changé
  service:
    name: sshd
    state: restarted