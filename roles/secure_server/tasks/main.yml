---
- name: Installer fail2ban et firewalld
  dnf:
    name:
      - fail2ban
      - firewalld
    state: present
    update_cache: yes

- name: Activer le service fail2ban
  service:
    name: fail2ban
    state: started
    enabled: yes

- name: Déployer une configuration fail2ban personnalisée (jail.local)
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 5
      bantime = 3600
      findtime = 600
    owner: root
    group: root
    mode: '0644'
  notify: Restart fail2ban

- name: Assurer le redémarrage de fail2ban si config changée
  meta: flush_handlers

- name: Configurer la politique par défaut Firewalld (deny incoming, allow outgoing)
  firewalld:
    zone: public
    target: DROP
    permanent: yes
    state: enabled
    immediate: yes

- name: Autoriser les connexions SSH
  firewalld:
    service: ssh
    permanent: yes
    state: enabled
    immediate: yes
    zone: public

- name: Autoriser le port Jenkins
  firewalld:
    port: "{{ jenkins_port }}/tcp"
    permanent: yes
    state: enabled
    immediate: yes
    zone: public

- name: Autoriser le port Minio Console
  firewalld:
    port: "{{ minio_console_port }}/tcp"
    permanent: yes
    state: enabled
    immediate: yes
    zone: public

- name: Autoriser le port PostgreSQL
  firewalld:
    port: 5432/tcp
    permanent: yes
    state: enabled
    immediate: yes
    zone: public

- name: Autoriser le port pgAdmin
  firewalld:
    port: "{{ pgadmin_port }}/tcp"
    permanent: yes
    state: enabled
    immediate: yes
    zone: public

- name: Autoriser le port Portainer
  firewalld:
    port: "{{ portainer_web_port }}/tcp"
    permanent: yes
    state: enabled
    immediate: yes
    zone: public

- name: Autoriser le port 80 (HTTP)
  firewalld:
    port: 80/tcp
    permanent: yes
    state: enabled
    immediate: yes
    zone: public

- name: Autoriser le port 443 (HTTPS)
  firewalld:
    port: 443/tcp
    permanent: yes
    state: enabled
    immediate: yes
    zone: public

- name: Autoriser le port Harbor NodePort
  firewalld:
    port: "{{ harbor_nodeport }}/tcp"
    permanent: yes
    state: enabled
    immediate: yes
    zone: public

- name: Redémarrer fail2ban si nécessaire
  service:
    name: fail2ban
    state: restarted
  when: false # handler utilisé